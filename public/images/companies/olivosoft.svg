<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="olivoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#554acc"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0d1117" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Logo Glyph: Stylized Modern "O" + Tech Leaf / Code Loop -->
  <g transform="translate(0, -5)">
    <!-- Outer ring -->
    <circle cx="50" cy="46" r="22" fill="none" stroke="url(#olivoGradient)" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="105 30"/>
    <!-- Center tech core -->
    <circle cx="50" cy="46" r="7" fill="url(#leafGrad)"/>
    <!-- Modern code terminal slash / accent -->
    <path d="M43 32 L57 60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">OLIVOSOFT</text>
</svg>

