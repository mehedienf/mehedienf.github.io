            <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0b0c10" fill-opacity="0.6">42 story points delivered out of 45 committed</text>
            <rect x="580" y="24" width="70" height="24" rx="12" fill="#10B981" fill-opacity="0.12"/>
            <text x="615" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">93.3%</text>
        </g>
        
        <g transform="translate(60, 235)">
            <rect width="680" height="70" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
            <circle cx="40" cy="35" r="18" fill="#10B981" fill-opacity="0.15"/>
            <circle cx="40" cy="35" r="8" fill="#10B981"/>
            <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0b0c10">Code Review &amp; Pull Requests</text>
            <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0b0c10" fill-opacity="0.6">Average turnaround time under 4 hours per pull request</text>
            <rect x="580" y="24" width="70" height="24" rx="12" fill="#10B981" fill-opacity="0.12"/>
            <text x="615" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Optimal</text>
        </g>
        
        <g transform="translate(60, 320)">
            <rect width="680" height="70" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
            <circle cx="40" cy="35" r="18" fill="#10B981" fill-opacity="0.15"/>
            <circle cx="40" cy="35" r="8" fill="#10B981"/>
            <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0b0c10">Automated Test Coverage Report</text>
            <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0b0c10" fill-opacity="0.6">89.4% unit and integration test branch coverage</text>
            <rect x="580" y="24" width="70" height="24" rx="12" fill="#10B981" fill-opacity="0.12"/>
            <text x="615" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Passing</text>
        </g>
        
</svg>