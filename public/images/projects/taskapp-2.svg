<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fd"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Browser Header Bar -->
  <rect width="800" height="52" rx="20" fill="#ffffff" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
  <rect y="32" width="800" height="20" fill="#ffffff"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="rgba(11,12,16,0.08)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="35" cy="26" r="6.5" fill="#EF4444"/>
  <circle cx="55" cy="26" r="6.5" fill="#F59E0B"/>
  <circle cx="75" cy="26" r="6.5" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="180" y="14" width="440" height="25" rx="6" fill="#f1f5f9" stroke="rgba(11,12,16,0.04)" stroke-width="1"/>
  <text x="400" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">https://preview.local/app/team-analytics</text>
  
  <!-- Page Header Banner inside window -->
  <rect x="60" y="75" width="680" height="56" rx="14" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.2"/>
  <text x="85" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0b0c10">Sprint Analytics &amp; Team Dashboard</text>
  <text x="85" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0b0c10" fill-opacity="0.65">Chart.js · Velocity Tracking · Burndown Metrics</text>
  <rect x="630" y="88" width="90" height="28" rx="14" fill="#10B981"/>
  <text x="675" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Analytics</text>
  
  <!-- Dynamic List Items -->
  
        <g transform="translate(60, 150)">
            <rect width="680" height="70" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
