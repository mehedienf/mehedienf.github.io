<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fd"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Browser Header Bar -->
  <rect width="800" height="52" rx="20" fill="#ffffff" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
  <rect y="32" width="800" height="20" fill="#ffffff"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="rgba(11,12,16,0.08)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="35" cy="26" r="6.5" fill="#EF4444"/>
  <circle cx="55" cy="26" r="6.5" fill="#F59E0B"/>
  <circle cx="75" cy="26" r="6.5" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="180" y="14" width="440" height="25" rx="6" fill="#f1f5f9" stroke="rgba(11,12,16,0.04)" stroke-width="1"/>
  <text x="400" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">https://preview.local/app/sticky-navigation</text>
  
  <!-- Page Header Banner inside window -->
  <rect x="60" y="75" width="680" height="56" rx="14" fill="#EC4899" fill-opacity="0.08" stroke="#EC4899" stroke-opacity="0.2"/>
  <text x="85" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0b0c10">Sticky Navigation &amp; Scrollspy</text>
  <text x="85" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0b0c10" fill-opacity="0.65">Dual-mode responsive navbar · Split connector timeline</text>
  <rect x="630" y="88" width="90" height="28" rx="14" fill="#EC4899"/>
  <text x="675" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Navigation</text>
  
  <!-- Dynamic List Items -->
  
        <g transform="translate(60, 150)">
            <rect width="680" height="70" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
            <circle cx="40" cy="35" r="18" fill="#EC4899" fill-opacity="0.15"/>
            <circle cx="40" cy="35" r="8" fill="#EC4899"/>
            <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0b0c10">Precision Reading-Focus Scrollspy</text>
            <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0b0c10" fill-opacity="0.6">Smooth tracking across all viewport sizes without drift</text>
            <rect x="580" y="24" width="70" height="24" rx="12" fill="#EC4899" fill-opacity="0.12"/>
            <text x="615" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">Verified</text>
        </g>
        
        <g transform="translate(60, 235)">
            <rect width="680" height="70" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
            <circle cx="40" cy="35" r="18" fill="#EC4899" fill-opacity="0.15"/>
            <circle cx="40" cy="35" r="8" fill="#EC4899"/>
            <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0b0c10">Mobile Pill Navigation Capsule</text>
            <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0b0c10" fill-opacity="0.6">Centered pill navbar with automatic overflow handling</text>
            <rect x="580" y="24" width="70" height="24" rx="12" fill="#EC4899" fill-opacity="0.12"/>
            <text x="615" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">Optimized</text>
        </g>
        
        <g transform="translate(60, 320)">
            <rect width="680" height="70" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="rgba(11,12,16,0.06)" stroke-width="1"/>
            <circle cx="40" cy="35" r="18" fill="#EC4899" fill-opacity="0.15"/>
            <circle cx="40" cy="35" r="8" fill="#EC4899"/>
            <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0b0c10">Static Build Generation</text>
