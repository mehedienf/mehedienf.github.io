            <rect x="580" y="24" width="70" height="24" rx="12" fill="#EC4899" fill-opacity="0.12"/>
            <text x="615" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">Exported</text>
        </g>
        
</svg>